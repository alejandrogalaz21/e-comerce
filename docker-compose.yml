services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: ecommerce-api
    environment:
      NODE_ENV: production
      # DB_SYNC=true hasta que existan migraciones TypeORM (pendiente documentado en docs/02-analisis-base.md)
      DB_SYNC: 'true'
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-changeme}
    ports:
      - '4000:8080'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:4000}
    container_name: ecommerce-web
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  postgres_data:
