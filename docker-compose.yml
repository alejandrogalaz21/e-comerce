services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    container_name: ecommerce-api
    environment:
      NODE_ENV: production
      PORT: 8080
      # Schema is owned by versioned migrations, never by the ORM
      DB_SYNC: 'false'
      DB_MIGRATIONS_RUN: 'true'
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      IMPORT_RATE_LIMIT: ${IMPORT_RATE_LIMIT:-20}
      ORDER_RATE_LIMIT: ${ORDER_RATE_LIMIT:-20}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '4000:8080'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:4000}
    container_name: ecommerce-web
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  postgres_data:
