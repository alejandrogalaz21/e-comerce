services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # A query, not pg_isready: that only asks whether the server accepts
      # connections and reports healthy while the database itself is missing,
      # which lets the API start against a server it cannot use.
      test:
        [
          'CMD-SHELL',
          'psql -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce} -c "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    container_name: ecommerce-api
    environment:
      NODE_ENV: production
      PORT: 8080
      # Schema is owned by versioned migrations, never by the ORM
      DB_SYNC: 'false'
      DB_MIGRATIONS_RUN: 'true'
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-ecommerce}
      # Left empty on purpose: an unset secret is generated per boot, while a
      # placeholder committed here would be a published signing key.
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      IMPORT_RATE_LIMIT: ${IMPORT_RATE_LIMIT:-20}
      ORDER_RATE_LIMIT: ${ORDER_RATE_LIMIT:-20}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '4000:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:8080/api/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:4000}
    container_name: ecommerce-web
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy

  # Development-only consoles: the devtools profile keeps them out of the default `up`
  adminer:
    image: adminer:4-standalone
    container_name: ecommerce-adminer
    profiles: [devtools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '8081:8080'
    depends_on:
      db:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ecommerce-redisinsight
    profiles: [devtools]
    environment:
      RI_REDIS_HOST0: redis
      RI_REDIS_PORT0: 6379
      RI_REDIS_ALIAS0: ecommerce-redis
      # Required for the pre-registered connection above to be created headlessly
      RI_ACCEPT_TERMS_AND_CONDITIONS: 'true'
    ports:
      - '5540:5540'
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redisinsight_data:
